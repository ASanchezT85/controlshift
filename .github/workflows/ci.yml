name: CI
on: [push, pull_request]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit, parser, GO-001 acceptance and the golden classes. A false-safe
      # finding fails here and blocks merge (MASTER SPEC 71).
      - run: cargo test --all

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      # Byte-for-byte reproducible or it is not a fixture. openpyxl stamps the
      # time into the workbook, so this is a live trap, not a formality.
      - run: python scripts/gen_go001.py
      - run: git diff --exit-code -- golden/

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: controlshift
          POSTGRES_PASSWORD: controlshift
          POSTGRES_DB: controlshift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U controlshift"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://controlshift:controlshift@127.0.0.1:5432/controlshift?schema=public
      JWT_SECRET: ci-secret
      # No clamd on the runner. The scanner itself is covered by scanner.test.ts
      # and uploads.test.ts, which drive the INSTREAM protocol against a stub
      # daemon in-process; this flag is the documented development override that
      # lets the rest of the pipeline run without one.
      ALLOW_UNSCANNED_ARTIFACTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The API shells out to the engine, so the binary has to exist first.
      - run: cargo build --release

      - name: install, migrate, build
        working-directory: services/api
        run: |
          npm ci
          npx prisma migrate deploy
          npx prisma generate
          npm run build

      # Each suite named, so a failure says which boundary broke.
      - name: tenancy and RBAC
        working-directory: services/api
        run: node --test dist/tenancy.test.js
      - name: artifact intake
        working-directory: services/api
        run: node --test dist/uploads.test.js
      - name: malware scanner protocol
        working-directory: services/api
        run: node --test dist/scanner.test.js
      - name: estimating and deliverables
        working-directory: services/api
        run: node --test dist/estimating.test.js
      - name: assumptions and exclusions
        working-directory: services/api
        run: node --test dist/commercial.test.js
      - name: report branding
        working-directory: services/api
        run: node --test dist/branding.test.js

      # The whole product: create, upload, scan, analyse, review, scope, price,
      # report, audit. The seed and the API resolve the engine and the golden
      # relative to their own directory, so both run from services/api.
      - name: seed
        working-directory: services/api
        run: node dist/seed.js
      - name: end to end
        working-directory: services/api
        run: |
          node dist/main.js &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:3000/api/opportunities && break
            [ "$i" = "30" ] && { echo "API never came up"; exit 1; }
            sleep 1
          done
          python ../../scripts/e2e_go001.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
