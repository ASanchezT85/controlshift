# Local development dependencies. Not a production topology.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: controlshift
      POSTGRES_PASSWORD: controlshift
      POSTGRES_DB: controlshift
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlshift"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
